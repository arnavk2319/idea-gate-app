name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests (network blocked, no API keys)
        env:
          ANTHROPIC_API_KEY: ""
          EXA_API_KEY: ""
        run: |
          if [ -d tests ]; then
            uv run pytest --disable-socket --allow-unix-socket
          else
            echo "No tests/ directory on this branch yet; skipping"
          fi

      - name: Build package
        run: uv build

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the version and commit-message checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version bump, releases.md and commit trailers
        run: python scripts/check_pr.py origin/${{ github.base_ref }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
