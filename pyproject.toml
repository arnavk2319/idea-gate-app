[project]
name = "ideagate"
version = "0.1.0"
description = "Idea validation pipeline: proof of spending first, pre-sell second, build only after commitments."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
ideagate = "ideagate.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-socket>=0.7", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideagate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
